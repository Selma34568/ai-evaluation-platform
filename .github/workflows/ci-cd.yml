name: EvalAI CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

  delivery:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release package
        run: |
          mkdir evalai-release
          cp -r backend/app evalai-release/backend-app
          cp backend/requirements.txt evalai-release/backend-requirements.txt
          cp -r frontend/src evalai-release/frontend-src
          cp frontend/package.json evalai-release/frontend-package.json
          cp frontend/package-lock.json evalai-release/frontend-package-lock.json
          cp README.md evalai-release/README.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: evalai-release-${{ github.sha }}
          path: evalai-release
          retention-days: 14